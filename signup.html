<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토닥토닥노트 - 원장님 회원가입</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      word-break: keep-all;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .signup-card {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      padding: 44px 38px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 14px;
      color: #94a3b8;
    }

    .plan-selector-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .plan-radio-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .plan-radio-box:hover {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(255, 255, 255, 0.07);
    }

    .plan-radio-box.active {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.15);
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.25);
    }

    .plan-radio-box.active.plan-pro {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.15);
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.25);
    }

    .plan-radio-name {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .plan-radio-price {
      font-size: 13px;
      font-weight: 700;
      color: #fee500;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 7px;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 14.5px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #fee500 0%, #facc15 100%);
      color: #111827;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 18px rgba(254, 229, 0, 0.3);
      transition: all 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(254, 229, 0, 0.45);
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13.5px;
      color: #94a3b8;
    }

    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      margin-left: 6px;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="signup-card">
    <div class="brand-header">
      <img src="open_book_heart_clean_1794109984125.jpg" alt="토닥토닥노트 로고" class="brand-logo">
      <h1 class="brand-title">토닥토닥노트 원장님 가입</h1>
      <p class="brand-sub">간편 가입 후 즉시 진료실 AI 요약 프로그램을 이용하실 수 있습니다.</p>
    </div>

    <!-- 기본형 / 고급형 선택 탭 버튼 -->
    <div class="plan-selector-group">
      <div class="plan-radio-box" id="tabPlanStandard" onclick="selectPlan('standard')">
        <div class="plan-radio-name">🟢 기본형 Standard</div>
        <div style="font-size: 11.5px; color: #94a3b8; text-decoration: line-through; margin-bottom: 2px;">정가 149,000원</div>
        <div class="plan-radio-price"><span style="font-size: 11px; color: #38bdf8; font-weight: 800; background: rgba(56, 189, 248, 0.15); padding: 1px 5px; border-radius: 4px; margin-right: 2px;">얼리버드</span> 월 89,000원</div>
      </div>
      <div class="plan-radio-box active plan-pro" id="tabPlanPro" onclick="selectPlan('pro')">
        <div class="plan-radio-name">⭐ 고급형 Pro</div>
        <div style="font-size: 11.5px; color: #94a3b8; text-decoration: line-through; margin-bottom: 2px;">정가 199,000원</div>
        <div class="plan-radio-price"><span style="font-size: 11px; color: #fee500; font-weight: 800; background: rgba(254, 229, 0, 0.15); padding: 1px 5px; border-radius: 4px; margin-right: 2px;">얼리버드</span> 월 139,000원</div>
      </div>
    </div>

    <!-- 7일 무료체험 얼리버드 혜택 안내 배너 -->
    <div style="background: rgba(14, 165, 233, 0.1); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 12px; padding: 13px 16px; margin-bottom: 22px; text-align: center; font-size: 13.5px; color: #7dd3fc; line-height: 1.55; word-break: keep-all;">
      🎁 <strong>7일 무료체험이 끝나기 전에 구독 결제 하시면 얼리버드 할인가로 적용 됩니다.</strong><br>
      <span style="font-size: 12px; color: #94a3b8;">(무료체험 종료 후 결제시 정가 적용)</span>
    </div>

    <form onsubmit="handleSignup(event)">
      <div class="form-group">
        <label class="form-label">아이디 (이메일 주소)</label>
        <input type="email" id="signupEmail" class="form-input" placeholder="doctor@hospital.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input type="password" id="signupPassword" class="form-input" placeholder="6자리 이상 입력" required minlength="6">
      </div>

      <div class="form-group">
        <label class="form-label">원장님 성함</label>
        <input type="text" id="signupDoctorName" class="form-input" placeholder="예: 박준혁 원장" required>
      </div>

      <div class="form-group">
        <label class="form-label">병원명</label>
        <input type="text" id="signupHospitalName" class="form-input" placeholder="예: 연세바른내과의원" required>
      </div>

      <div class="form-group">
        <label class="form-label">병원 전화번호</label>
        <input type="tel" id="signupPhone" class="form-input" placeholder="예: 02-1234-5678 또는 010-0000-0000" required>
      </div>

      <div style="font-size: 12.5px; color: #94a3b8; text-align: center; margin-bottom: 14px; line-height: 1.5;">
        가입을 완료하시면 <a href="terms.html" target="_blank" style="color: #38bdf8; text-decoration: underline;">이용약관</a> 및 <a
          href="privacy.html" target="_blank"
          style="color: #38bdf8; text-decoration: underline; font-weight: 700;">개인정보처리방침</a>에 동의하는 것으로 간주됩니다.
      </div>

      <button type="submit" class="btn-submit">
        7일 무료체험 시작하기
      </button>
    </form>

    <div class="auth-footer">
      이미 계정이 있으신가요?
      <a href="login.html">로그인하기</a>
    </div>
  </div>

  <script>
    // URL 파라미터에서 선택한 플랜 가져오기 (예: ?plan=standard 또는 ?plan=pro)
    const urlParams = new URLSearchParams(window.location.search);
    let currentPlan = urlParams.get('plan') || 'pro';

    function selectPlan(plan) {
      currentPlan = plan;
      const stdTab = document.getElementById('tabPlanStandard');
      const proTab = document.getElementById('tabPlanPro');

      if (plan === 'standard') {
        stdTab.classList.add('active');
        proTab.classList.remove('active');
      } else {
        proTab.classList.add('active');
        stdTab.classList.remove('active');
      }
    }

    // 초기 로딩 시 플랜 설정
    selectPlan(currentPlan);

    async function handleSignup(e) {
      e.preventDefault();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const doctorName = document.getElementById('signupDoctorName').value.trim();
      const hospitalName = document.getElementById('signupHospitalName').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();

      const btn = document.querySelector('.btn-submit');
      const originalText = btn.textContent;
      btn.textContent = '⏳ 회원 등록 처리 중...';
      btn.disabled = true;

      try {
        const user = await TodakDB.signUp({
          email,
          password,
          doctorName,
          hospitalName,
          phone,
          plan: currentPlan === 'standard' ? 'Standard' : 'Pro'
        });

        // 🌟 [실시간 알림] 대표님 네이버 이메일로 신규 회원가입 알림 자동 전송 (비동기)
        try {
          fetch('/api/notify-signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: user.email,
              doctorName: user.doctorName,
              hospitalName: user.hospitalName,
              phone: user.phone,
              plan: user.plan
            })
          }).catch(err => console.warn('가입 알림 전송 예외:', err));
        } catch (e) { }

        localStorage.setItem('todak_current_user', JSON.stringify(user));
        localStorage.removeItem('todak_desk_queue');

        alert(`🎉 환영합니다, ${user.hospitalName} ${user.doctorName}님!\n7일간 무료체험이 시작되었습니다.\n진료실 프로그램으로 즉시 입장합니다.`);
        window.location.href = 'clinic.html';
      } catch (err) {
        alert(err.message || '회원가입 처리 중 오류가 발생했습니다.');
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }
  </script>
  <script src="todak-db.js"></script>
</body>

</html>
