<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Supabase Users DB 진단</title>
</head>
<body style="font-family: monospace; padding: 20px;">
  <h2>Supabase Users 진단 도구</h2>
  <button onclick="testRead()" style="padding: 10px 20px; font-size: 16px;">1. users 테이블 전체 목록 조회</button>
  <button onclick="testInsert()" style="padding: 10px 20px; font-size: 16px; margin-left: 10px;">2. 테스트 계정 강제 등록</button>
  
  <div style="margin-top: 20px; padding: 15px; border: 2px solid #0284c7; border-radius: 8px;">
    <h3>마동석/마블리 계정 Supabase에 즉시 강제 등록/수정</h3>
    <input type="text" id="mEmail" placeholder="마동석 가입 이메일" style="padding: 8px; width: 250px;">
    <input type="text" id="mPass" placeholder="비밀번호" style="padding: 8px; width: 120px;">
    <input type="text" id="mHosp" value="마블리내과" placeholder="병원명" style="padding: 8px; width: 150px;">
    <input type="text" id="mDoc" value="마동석 원장" placeholder="원장명" style="padding: 8px; width: 120px;">
    <button onclick="forceUpsertMabely()" style="padding: 8px 16px; background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer;">
      🚀 이 정보로 DB 즉시 동기화
    </button>
  </div>

  <pre id="output" style="background: #eee; padding: 15px; margin-top: 15px;"></pre>

  <script>
    const SUPABASE_URL = 'https://fabzvobawvtsdprixmyf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_h8kmyQtu5Q25wDiIHv3ZiQ_oiOCAc8O';

    async function forceUpsertMabely() {
      const out = document.getElementById('output');
      const email = document.getElementById('mEmail').value.trim().toLowerCase();
      const password = document.getElementById('mPass').value.trim();
      const hospital_name = document.getElementById('mHosp').value.trim();
      const doctor_name = document.getElementById('mDoc').value.trim();

      if (!email || !password) {
        alert('이메일과 비밀번호를 입력해 주세요!');
        return;
      }

      out.textContent = '마블리내과 계정 Supabase DB 등록 중...';
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates,return=representation'
          },
          body: JSON.stringify({
            email,
            password,
            hospital_name,
            doctor_name,
            phone: '010-0000-0000',
            plan: 'Pro',
            updated_at: new Date().toISOString()
          })
        });
        const text = await res.text();
        out.textContent = `[동기화 완료 상태코드: ${res.status}]\n` + text;
      } catch (err) {
        out.textContent = '에러 발생: ' + err.message;
      }
    }

    async function testRead() {
      const out = document.getElementById('output');
      out.textContent = '조회 중...';
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        const text = await res.text();
        out.textContent = `[상태코드: ${res.status}]\n` + text;
      } catch (err) {
        out.textContent = '에러: ' + err.message;
      }
    }

    async function testInsert() {
      const out = document.getElementById('output');
      out.textContent = '등록 시도 중...';
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify({
            email: 'test_direct@todak.com',
            password: '123',
            doctor_name: '테스트원장',
            hospital_name: '테스트병원',
            phone: '010-0000-0000',
            plan: 'Pro'
          })
        });
        const text = await res.text();
        out.textContent = `[등록 상태코드: ${res.status}]\n` + text;
      } catch (err) {
        out.textContent = '등록 에러: ' + err.message;
      }
    }
  </script>
</body>
</html>
