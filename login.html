<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토닥토닥노트 - 원장님 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      word-break: keep-all;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .login-card {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      padding: 44px 38px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 14px;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 14.5px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #fee500 0%, #facc15 100%);
      color: #111827;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 18px rgba(254, 229, 0, 0.3);
      transition: all 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(254, 229, 0, 0.45);
    }

    .auth-footer {
      text-align: center;
      margin-top: 26px;
      font-size: 13.5px;
      color: #94a3b8;
    }

    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      margin-left: 6px;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="brand-header">
      <img src="open_book_heart_clean_1794109984125.jpg" alt="토닥토닥노트 로고" class="brand-logo">
      <h1 class="brand-title">원장님 진료실 로그인</h1>
      <p class="brand-sub">가입하신 이메일 계정으로 로그인해 주세요.</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">아이디 (이메일)</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="doctor@hospital.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="비밀번호 입력" required>
      </div>

      <button type="submit" class="btn-submit">
        진료실 프로그램 입장하기
      </button>
    </form>

    <div class="auth-footer">
      아직 계정이 없으신가요?
      <a href="signup.html">회원가입하기</a>
      <div style="margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.1);">
        <a href="clear-data.html" style="color: #f87171; font-size: 12px; font-weight: normal;">🧹 테스트 데이터 및 계정 완전
          초기화</a>
      </div>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      // 1) Supabase DB에서 최신 회원정보 직접 조회 (어떤 기기든 100% 실시간 연동)
      const SUPABASE_URL = 'https://fabzvobawvtsdprixmyf.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_h8kmyQtu5Q25wDiIHv3ZiQ_oiOCAc8O';

      let loggedUser = null;
      try {
        const dbRes = await fetch(`${SUPABASE_URL}/rest/v1/users?email=eq.${encodeURIComponent(email.toLowerCase())}&select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        if (dbRes.ok) {
          const list = await dbRes.json();
          if (Array.isArray(list) && list.length > 0) {
            const row = list[0];
            if (row.password !== password) {
              alert('비밀번호가 일치하지 않습니다.');
              return;
            }
            loggedUser = {
              email: row.email,
              password: row.password,
              doctorName: row.doctor_name || '원장',
              hospitalName: row.hospital_name || '',
              phone: row.phone || '',
              plan: row.plan || 'Pro',
              naverReviewUrl: row.naver_review_url || '',
              logoUrl: row.logo_url || '',
              joinedAt: row.created_at
            };
          }
        }
      } catch (cloudErr) {
        console.warn("Supabase 직접 조회 실패, 로컬 캐시 조회:", cloudErr);
      }

      // 2) 서버에 없거나 오프라인일 경우 로컬스토리지 조회
      if (!loggedUser) {
        const savedUserStr = localStorage.getItem('todak_user_' + email);
        if (savedUserStr) {
          const user = JSON.parse(savedUserStr);
          if (user.password === password) {
            loggedUser = user;
          } else {
            alert('비밀번호가 일치하지 않습니다.');
            return;
          }
        }
      }

      // 3) 그래도 없으면 데모 계정 체크 또는 가입 안내
      if (!loggedUser) {
        if (email === 'doctor@hospital.com') {
          loggedUser = {
            email,
            doctorName: '홍길동',
            hospitalName: '길동이의원',
            plan: 'Pro'
          };
        } else {
          alert('등록되지 않은 이메일 주소이거나 비밀번호가 일치하지 않습니다.\n회원가입을 먼저 진행해 주세요.');
          window.location.href = 'signup.html';
          return;
        }
      }

      // 이전 로그인 사용자와 다르면 이전 대기열 캐시 초기화
      const prevUserStr = localStorage.getItem('todak_current_user');
      if (prevUserStr) {
        try {
          const prevUser = JSON.parse(prevUserStr);
          if (prevUser.email !== loggedUser.email) {
            localStorage.removeItem('todak_desk_queue');
          }
        } catch (e) { }
      }

      localStorage.setItem('todak_user_' + loggedUser.email, JSON.stringify(loggedUser));
      localStorage.setItem('todak_current_user', JSON.stringify(loggedUser));
      alert(`🎉 환영합니다, ${loggedUser.hospitalName} ${loggedUser.doctorName}님!\n진료실 프로그램으로 입장합니다.`);
      window.location.href = 'clinic.html';
    }
  </script>
</body>

</html>
