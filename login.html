<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토닥토닥노트 - 원장님 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      word-break: keep-all;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .login-card {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      padding: 44px 38px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    .brand-title {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .brand-sub {
      font-size: 14px;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 14.5px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #fee500 0%, #facc15 100%);
      color: #111827;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 18px rgba(254, 229, 0, 0.3);
      transition: all 0.2s;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(254, 229, 0, 0.45);
    }

    .auth-footer {
      text-align: center;
      margin-top: 26px;
      font-size: 13.5px;
      color: #94a3b8;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      margin-left: 6px;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <img src="open_book_heart_clean_1794109984125.jpg" alt="토닥토닥노트 로고" class="brand-logo">
      <h1 class="brand-title">원장님 진료실 로그인</h1>
      <p class="brand-sub">가입하신 이메일 계정으로 로그인해 주세요.</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">아이디 (이메일)</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="doctor@hospital.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="비밀번호 입력" required>
      </div>

      <button type="submit" class="btn-submit">
        진료실 프로그램 입장하기
      </button>
    </form>

    <div class="auth-footer">
      아직 계정이 없으신가요?
      <a href="signup.html">회원가입하기</a>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const savedUserStr = localStorage.getItem('todak_user_' + email);

      if (!savedUserStr) {
        // 데모용 기본 계정 허용 또는 신규 가입 유도
        if (email === 'doctor@hospital.com' || email.includes('@')) {
          const defaultUser = {
            email,
            doctorName: '박준혁 원장',
            hospitalName: '연세바른내과의원',
            plan: 'Pro'
          };
          localStorage.setItem('todak_current_user', JSON.stringify(defaultUser));
          alert(`🎉 환영합니다, ${defaultUser.doctorName}님!\n진료실 프로그램으로 입장합니다.`);
          window.location.href = 'clinic.html';
          return;
        }
        alert('등록되지 않은 이메일 주소입니다. 회원가입을 먼저 진행해 주세요.');
        window.location.href = 'signup.html';
        return;
      }

      const user = JSON.parse(savedUserStr);
      if (user.password !== password) {
        alert('비밀번호가 일치하지 않습니다.');
        return;
      }

      localStorage.setItem('todak_current_user', JSON.stringify(user));
      alert(`🎉 환영합니다, ${user.hospitalName} ${user.doctorName}님!\n진료실 프로그램으로 입장합니다.`);
      window.location.href = 'clinic.html';
    }
  </script>
</body>
</html>
