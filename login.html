<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토닥토닥노트 - 원장님 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      word-break: keep-all;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .login-card {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      padding: 44px 38px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 14px;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 14.5px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #fee500 0%, #facc15 100%);
      color: #111827;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 18px rgba(254, 229, 0, 0.3);
      transition: all 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(254, 229, 0, 0.45);
    }

    .auth-footer {
      text-align: center;
      margin-top: 26px;
      font-size: 13.5px;
      color: #94a3b8;
    }

    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      margin-left: 6px;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="brand-header">
      <img src="open_book_heart_clean_1794109984125.jpg" alt="토닥토닥노트 로고" class="brand-logo">
      <h1 class="brand-title">원장님 진료실 로그인</h1>
      <p class="brand-sub">가입하신 이메일 계정으로 로그인해 주세요.</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">아이디 (병원 이메일)</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="doctor@hospital.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">비밀번호 (또는 진료실 전용 접속 코드)</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="대표원장 비밀번호 또는 진료실 접속 코드" required>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 6px; line-height: 1.4;">
          * 부원장님은 대표원장님이 발급해 주신 <strong>진료실 전용 접속 코드</strong>로 안전하게 로그인하실 수 있습니다.
        </p>
      </div>

      <button type="submit" class="btn-submit">
        진료실 프로그램 입장하기
      </button>
    </form>

    <div class="auth-footer">
      아직 계정이 없으신가요?
      <a href="signup.html">회원가입하기</a>
      <div style="margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.1);">
        <a href="clear-data.html" style="color: #f87171; font-size: 12px; font-weight: normal;">🧹 테스트 데이터 및 계정 완전
          초기화</a>
      </div>
    </div>
  </div>

  <script src="todak-db.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const submitBtn = document.querySelector('.btn-submit');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = '⏳ 로그인 확인 중...';
      submitBtn.disabled = true;

      try {
        const user = await TodakDB.signIn({ email, password });
        localStorage.setItem('todak_current_user', JSON.stringify(user));

        if (user.isMaster === false && user.selectedRoom) {
          alert(`🎉 [진료실 로그인 성공]\n\n환영합니다, ${user.hospitalName} ${user.selectedRoom.roomName} (${user.selectedRoom.doctorName}) 원장님!\n진료실 프로그램으로 입장합니다.`);
        } else {
          alert(`🎉 [대표원장 로그인 성공]\n\n환영합니다, ${user.hospitalName} ${user.doctorName} 대표원장님!\n진료실 프로그램으로 입장합니다.`);
        }

        window.location.href = 'clinic.html';
      } catch (err) {
        alert(err.message || '로그인에 실패했습니다.');
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    }
  </script>
</body>

</html>
